name: Secret exfiltration lookalikes
# Legitimate patterns that share surface features with FG-028 signals.
# None should fire.
on: push
jobs:
  sandbox-assertions:
    runs-on: ubuntu-latest
    steps:
      - name: Verify sandbox hides runner process
        run: |
          if ! ps -e -o comm= | grep -Fxq 'Runner.Worker'; then
            echo "::error::Runner.Worker not found on host"; exit 1
          fi
          if grep -azq '^PROXY_TOKEN=' "/proc/$proxy_pid/environ"; then
            echo "::error::proxy inherited PROXY_TOKEN"; exit 1
          fi
  runner-tuning:
    runs-on: ubuntu-latest
    steps:
      - name: Move runner into cgroup
        run: |
          sudo cgclassify -g cpu,memory:ci $(pgrep 'Runner.Worker' | tr '\n' ' ')
          worker="$(readlink -f "/proc/$PPID/exe")"
          mem_gb=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1024 / 1024 ))
          echo "$worker $mem_gb"
  secrets-to-env:
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets into env
        run: |
          echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' >> "$GITHUB_ENV"
          curl -fsSL https://get.example.com/install.sh -o install.sh
          curl -fsSL https://get.example.com/tool.sh | sh -s -- -d /opt/tool
      - uses: example-org/secrets-to-env@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v1
        with:
          secrets: ${{ toJSON(secrets) }}
  internal-deploy:
    runs-on: self-hosted
    steps:
      - name: Render config for internal host
        env:
          ALL: ${{ toJSON(secrets) }}
          TARGET: http://10.20.0.5:8080/deploy
        run: ./render-config.sh
  filtered-env-report:
    runs-on: ubuntu-latest
    steps:
      - name: Report build context
        run: |
          curl -X POST -d "github=$(printenv | grep "GITHUB_*")" -d "status=ok" https://status.example.com/report
  debug-env:
    runs-on: ubuntu-latest
    steps:
      - name: Debug environment
        run: |
          printenv | sort
          docker exec app env | grep -E '(REDIS|DEBUG)' || true
          until nc -z localhost 5432; do sleep 1; done
          curl -fsS https://health.example.com/ping
